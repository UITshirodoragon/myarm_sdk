plugin_adapter: pinocchio
robot_description:
  package: myarm_description
  relative_path: urdf/myarm_m750_poe_v3_2.urdf
frames:
  base: base_link
  tool: tool0
joint_names:
  - shoulder_pan_joint
  - shoulder_lift_joint
  - elbow_flex_joint
  - forearm_roll_joint
  - wrist_flex_joint
  - wrist_roll_joint
solver:
  max_iterations: 100
  position_tolerance_m: 0.001
  orientation_tolerance_rad: 0.02
  damping: 0.001
  step_size: 0.5
