# Explicit fake-only camera profile for the NeuGrasp scan launch.
# It is deliberately separate from the hardware calibration template.  Never
# use it for a physical robot or copy it into a real calibration record.
schema_version: 1
calibration_id: "fake_wrist_camera_v1"
calibration_sha256: "not-applicable-fake-profile"
status: "FAKE"

parent_frame: "gripper_base_link"
camera_body_frame: "wrist_camera_link"
camera_optical_frame: "wrist_camera_optical_frame"
camera_profile: "logitech_c925_wrist_v1"

# A non-zero named simulation mount makes the camera/tool conversion visible in
# TF without pretending to describe an installed physical bracket.
mount:
  translation_m: [-0.0215, 0.000, -0.0214]
  rpy_rad: [0.0, -1.5707963267948966, 0.0]

camera_body:
  translation_m: [0.00209, 0.000, 0.025]
  rpy_rad: [0.0, 0.0, 0.0]

# Mirrored provenance for the named C925 Xacro profile. That profile, not
# this FAKE record, is the runtime owner of the fixed joints.
camera_optical:
  translation_m: [0.04, 0.0, 0.03]
  rpy_rad: [-1.570796326794897, 0.0, -1.570796326794897]
