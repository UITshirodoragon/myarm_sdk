# Contract template only. It is NOT a usable hardware calibration.
#
# The NeuGrasp launch layer must reject this file for physical motion until
# `status` is CALIBRATED, the ID/hash are populated, and the numeric transform
# is verified against the installed camera. A fake/simulation profile may use
# its own explicitly named calibration file with status FAKE.

schema_version: 1
calibration_id: "UNSET"
# `sha256:<hex>` of the canonical JSON calibration payload with this provenance
# field omitted. It must be generated by the calibration/export tool, not by
# hand; `neugrasp_system.launch.py` verifies it for status CALIBRATED.
calibration_sha256: "UNSET"
status: "UNVERIFIED"  # Allowed operational values: CALIBRATED, FAKE.

# These frame names are part of the robot-description contract and must not
# change without regenerating the application URDF/profile.
parent_frame: "gripper_base_link"
camera_body_frame: "wrist_camera_link"
camera_optical_frame: "wrist_camera_optical_frame"

# ``generic`` consumes the three transforms below at launch. Named profiles
# such as ``logitech_c925e_wrist_v1`` use a fixed model Xacro; keep the values
# mirrored here for calibration provenance and review.
camera_profile: "generic"

# T_gripper_base_mount: calibrated physical bracket/mount transform.
mount:
  translation_m: [0.0, 0.0, 0.0]
  rpy_rad: [0.0, 0.0, 0.0]

# T_mount_camera_body: fixed body offset measured from the mount frame.
# Keep this identity only when the camera body origin is exactly the mount.
camera_body:
  translation_m: [0.0, 0.0, 0.0]
  rpy_rad: [0.0, 0.0, 0.0]

# T_camera_body_optical. Its default rotation follows REP-103: x right, y
# down, z forward. Do not duplicate this transform in a static TF publisher.
camera_optical:
  translation_m: [0.0, 0.0, 0.0]
  rpy_rad: [-1.570796326794897, 0.0, -1.570796326794897]
